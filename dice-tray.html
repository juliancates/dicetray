<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Tray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-dark: #12261D;
    --felt: #1C3E30;
    --felt-light: #2A5A47;
    --felt-seam: rgba(241,234,216,0.08);
    --ivory: #F1EAD8;
    --ivory-dim: #C9C2AE;
    --brass: #C9A24B;
    --brass-bright: #E4C371;
    --ink: #0E1A14;

    --c4: #7FA087;
    --c6: #E4DAC0;
    --c8: #C97B5B;
    --c10: #6E8FB0;
    --c12: #A98BC4;
    --c20: #D6AE52;
    --c100: #B5533B;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    font-family: 'Inter', sans-serif;
    color: var(--ivory);
    display:flex;
    justify-content:center;
    padding: 40px 16px 64px;
  }

  .wrap{
    width:100%;
    max-width: 640px;
  }

  header{
    text-align:center;
    margin-bottom: 28px;
  }

  header h1{
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size: 2.1rem;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    color: var(--brass-bright);
  }

  header p{
    margin:0;
    color: var(--ivory-dim);
    font-size: 0.95rem;
  }

  .panel{
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.12));
    border: 1px solid var(--felt-seam);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .picker-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  @media (max-width: 480px){
    .picker-grid{ grid-template-columns: repeat(3, 1fr); }
  }

  .picker{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 8px;
    padding: 12px 6px 10px;
    border-radius: 10px;
    background: rgba(0,0,0,0.15);
    border: 1px solid transparent;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .picker.active{
    border-color: rgba(201,162,75,0.5);
    background: rgba(201,162,75,0.08);
  }

  .mini-die{
    width: 44px;
    height: 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size: 0.85rem;
    color: var(--ink);
  }

  .picker-label{
    font-size: 0.78rem;
    color: var(--ivory-dim);
    letter-spacing: 0.02em;
  }

  .stepper{
    display:flex;
    align-items:center;
    gap: 6px;
  }

  .stepper button{
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: none;
    background: rgba(241,234,216,0.12);
    color: var(--ivory);
    font-size: 1rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .stepper button:hover{ background: rgba(241,234,216,0.22); }
  .stepper button:active{ transform: scale(0.9); }
  .stepper button:focus-visible, button:focus-visible, .picker:focus-visible{
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  .stepper .count{
    min-width: 18px;
    text-align:center;
    font-weight:700;
    font-variant-numeric: tabular-nums;
  }

  .controls-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .summary{
    font-size: 0.92rem;
    color: var(--ivory-dim);
    min-height: 1.3em;
  }

  .summary strong{ color: var(--ivory); font-weight:600; }

  .action-buttons{
    display:flex;
    gap: 10px;
    margin-left:auto;
  }

  .btn{
    font-family:'Inter', sans-serif;
    border:none;
    border-radius: 10px;
    padding: 12px 18px;
    font-weight:700;
    font-size: 0.95rem;
    cursor:pointer;
    transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:active{ transform: translateY(1px); }

  .btn-clear{
    background: rgba(241,234,216,0.08);
    color: var(--ivory-dim);
  }
  .btn-clear:hover{ background: rgba(241,234,216,0.16); color: var(--ivory); }

  .btn-roll{
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    color: var(--ink);
    letter-spacing: 0.06em;
    padding: 12px 28px;
    box-shadow: 0 4px 0 #8C6D2E, 0 8px 16px rgba(0,0,0,0.35);
  }
  .btn-roll:hover:not(:disabled){ filter: brightness(1.06); }
  .btn-roll:active:not(:disabled){ box-shadow: 0 2px 0 #8C6D2E, 0 4px 8px rgba(0,0,0,0.35); }
  .btn-roll:disabled{ opacity: 0.55; cursor: default; }

  .tray{
    min-height: 150px;
    border-radius: 14px;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 14px),
      radial-gradient(ellipse at 50% 20%, var(--felt-light), var(--felt-dark) 85%);
    border: 1px solid var(--felt-seam);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.35);
    padding: 22px;
    display:flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 14px;
    justify-content: center;
  }

  .tray-empty{
    margin: auto;
    color: rgba(241,234,216,0.35);
    font-size: 0.9rem;
    text-align:center;
  }

  .die{
    position: relative;
    width: 58px;
    height: 58px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size: 1.15rem;
    color: var(--ink);
    box-shadow: 0 6px 10px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.15);
    animation: drop 0.35s ease-out;
  }

  .die .type-tag{
    position:absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    font-weight:600;
    color: var(--ivory-dim);
    letter-spacing: 0.03em;
  }

  .die[data-type="4"]{ background: var(--c4); clip-path: polygon(50% 4%, 4% 96%, 96% 96%); }
  .die[data-type="4"] .face{ padding-top: 14px; }
  .die[data-type="6"]{ background: var(--c6); border-radius: 16%; }
  .die[data-type="8"]{ background: var(--c8); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
  .die[data-type="10"]{ background: var(--c10); clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
  .die[data-type="10"] .face{ padding-top: 6px; }
  .die[data-type="12"]{ background: var(--c12); clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
  .die[data-type="20"]{ background: var(--c20); border-radius: 50%; width:64px; height:64px; font-size:1.25rem; }
  .die[data-type="100"]{ background: var(--c100); border-radius: 20%; width:64px; height:64px; color: var(--ivory); }

  .pip-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 68%;
    height: 68%;
  }
  .pip{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pip::after{
    content:'';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
  }
  .pip.on::after{ background: var(--ink); }

  @keyframes drop{
    from{ opacity: 0; transform: translateY(-14px) scale(0.85); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .die.tumbling{
    animation: tumble 0.14s linear infinite;
  }
  @keyframes tumble{
    0%{ transform: rotate(-6deg) scale(1.02); }
    50%{ transform: rotate(6deg) scale(0.98); }
    100%{ transform: rotate(-6deg) scale(1.02); }
  }

  .die.settled{
    animation: settle 0.32s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes settle{
    0%{ transform: scale(1.22) rotate(0deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .die{ animation: none; }
    .die.tumbling{ animation: none; }
    .die.settled{ animation: none; }
  }

  .results{
    margin-top: 18px;
  }

  .breakdown{
    display:flex;
    flex-direction:column;
    gap: 6px;
    margin-bottom: 14px;
    font-size: 0.88rem;
    color: var(--ivory-dim);
  }
  .breakdown-row span.label{ color: var(--ivory); font-weight:600; }

  .total-row{
    display:flex;
    align-items:baseline;
    justify-content: center;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--felt-seam);
  }
  .total-row .total-label{
    font-family:'Roboto Slab', serif;
    font-size: 1rem;
    color: var(--ivory-dim);
    letter-spacing: 0.03em;
  }
  .total-row .total-value{
    font-family:'Roboto Slab', serif;
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--brass-bright);
    font-variant-numeric: tabular-nums;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Dice Tray</h1>
    <p>Pick your dice, then roll as many times as you like.</p>
  </header>

  <div class="panel">
    <div class="picker-grid" id="pickerGrid"></div>

    <div class="controls-row">
      <div class="summary" id="summary" aria-live="polite">No dice selected yet.</div>
      <div class="action-buttons">
        <button class="btn btn-clear" id="clearBtn">Clear</button>
        <button class="btn btn-roll" id="rollBtn" disabled>ROLL</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="tray" id="tray">
      <div class="tray-empty" id="trayEmpty">Select some dice above and hit ROLL.</div>
    </div>

    <div class="results" id="results" style="display:none;">
      <div class="breakdown" id="breakdown"></div>
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-value" id="totalValue">0</span>
      </div>
    </div>
  </div>

  <div class="sr-only" role="status" id="announcer"></div>

</div>

<script>
  const DIE_TYPES = [4, 6, 8, 10, 12, 20, 100];
  const counts = Object.fromEntries(DIE_TYPES.map(t => [t, 0]));

  const pickerGrid = document.getElementById('pickerGrid');
  const summaryEl = document.getElementById('summary');
  const rollBtn = document.getElementById('rollBtn');
  const clearBtn = document.getElementById('clearBtn');
  const tray = document.getElementById('tray');
  const trayEmpty = document.getElementById('trayEmpty');
  const resultsEl = document.getElementById('results');
  const breakdownEl = document.getElementById('breakdown');
  const totalValueEl = document.getElementById('totalValue');
  const announcer = document.getElementById('announcer');

  const PIP_PATTERNS = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
  };

  function buildPipGrid(value){
    const active = new Set(PIP_PATTERNS[value] || []);
    const grid = document.createElement('div');
    grid.className = 'pip-grid';
    for(let i=0;i<9;i++){
      const p = document.createElement('div');
      p.className = 'pip' + (active.has(i) ? ' on' : '');
      grid.appendChild(p);
    }
    return grid;
  }

  function buildMiniDieFace(type){
    if(type === 6){
      const el = document.createElement('div');
      el.appendChild(buildPipGrid(3));
      return el;
    }
    const span = document.createElement('span');
    span.textContent = 'd' + type;
    span.style.fontSize = '0.7rem';
    return span;
  }

  // Build picker UI
  DIE_TYPES.forEach(type => {
    const picker = document.createElement('div');
    picker.className = 'picker';
    picker.dataset.type = type;

    const mini = document.createElement('div');
    mini.className = 'die mini-die';
    mini.dataset.type = type;
    mini.appendChild(buildMiniDieFace(type));

    const label = document.createElement('div');
    label.className = 'picker-label';
    label.textContent = 'd' + type;

    const stepper = document.createElement('div');
    stepper.className = 'stepper';

    const minus = document.createElement('button');
    minus.type = 'button';
    minus.textContent = '−';
    minus.setAttribute('aria-label', 'Remove a d' + type);

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = '0';

    const plus = document.createElement('button');
    plus.type = 'button';
    plus.textContent = '+';
    plus.setAttribute('aria-label', 'Add a d' + type);

    minus.addEventListener('click', () => changeCount(type, -1));
    plus.addEventListener('click', () => changeCount(type, 1));

    stepper.append(minus, count, plus);
    picker.append(mini, label, stepper);
    pickerGrid.appendChild(picker);
  });

  function changeCount(type, delta){
    counts[type] = Math.max(0, Math.min(20, counts[type] + delta));
    refreshPickers();
    refreshSummary();
  }

  function refreshPickers(){
    DIE_TYPES.forEach(type => {
      const picker = pickerGrid.querySelector(`.picker[data-type="${type}"]`);
      const countEl = picker.querySelector('.count');
      countEl.textContent = counts[type];
      picker.classList.toggle('active', counts[type] > 0);
    });
  }

  function totalDiceCount(){
    return DIE_TYPES.reduce((sum, t) => sum + counts[t], 0);
  }

  function refreshSummary(){
    const parts = DIE_TYPES.filter(t => counts[t] > 0).map(t => `${counts[t]}d${t}`);
    if(parts.length === 0){
      summaryEl.innerHTML = 'No dice selected yet.';
      rollBtn.disabled = true;
    } else {
      summaryEl.innerHTML = 'Rolling: <strong>' + parts.join(' + ') + '</strong>';
      rollBtn.disabled = false;
    }
  }

  clearBtn.addEventListener('click', () => {
    DIE_TYPES.forEach(t => counts[t] = 0);
    refreshPickers();
    refreshSummary();
    tray.innerHTML = '';
    tray.appendChild(trayEmpty);
    resultsEl.style.display = 'none';
  });

  function randForType(type){
    return 1 + Math.floor(Math.random() * type);
  }

  function buildDieFace(type, value){
    if(type === 6){
      return buildPipGrid(value);
    }
    const face = document.createElement('span');
    face.className = 'face';
    face.textContent = value;
    return face;
  }

  function createDieElement(type){
    const die = document.createElement('div');
    die.className = 'die';
    die.dataset.type = type;

    const face = buildDieFace(type, randForType(type));
    die.appendChild(face);

    const tag = document.createElement('span');
    tag.className = 'type-tag';
    tag.textContent = 'd' + type;
    die.appendChild(tag);

    return die;
  }

  function reducedMotion(){
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function rollDie(dieEl, type, finalValue, tumbleDuration){
    return new Promise(resolve => {
      if(reducedMotion()){
        renderFace(dieEl, type, finalValue);
        resolve();
        return;
      }
      dieEl.classList.add('tumbling');
      const flicker = setInterval(() => {
        renderFace(dieEl, type, randForType(type));
      }, 70);

      setTimeout(() => {
        clearInterval(flicker);
        dieEl.classList.remove('tumbling');
        renderFace(dieEl, type, finalValue);
        dieEl.classList.add('settled');
        setTimeout(() => dieEl.classList.remove('settled'), 350);
        resolve();
      }, tumbleDuration);
    });
  }

  function renderFace(dieEl, type, value){
    const old = dieEl.querySelector('.face, .pip-grid');
    const face = buildDieFace(type, value);
    if(old) old.replaceWith(face);
    dieEl.dataset.value = value;
  }

  async function performRoll(){
    rollBtn.disabled = true;
    clearBtn.disabled = true;

    tray.innerHTML = '';
    resultsEl.style.display = 'none';

    const dieEntries = [];
    DIE_TYPES.forEach(type => {
      for(let i=0;i<counts[type]; i++){
        dieEntries.push(type);
      }
    });

    const dieElements = dieEntries.map(type => {
      const el = createDieElement(type);
      tray.appendChild(el);
      return { type, el };
    });

    const rollPromises = dieElements.map(({type, el}, i) => {
      const finalValue = randForType(type);
      const duration = 550 + Math.floor(Math.random() * 300) + (i % 5) * 40;
      return rollDie(el, type, finalValue, duration).then(() => finalValue);
    });

    const finalValues = await Promise.all(rollPromises);

    // Build breakdown grouped by type
    const grouped = {};
    dieEntries.forEach((type, i) => {
      if(!grouped[type]) grouped[type] = [];
      grouped[type].push(finalValues[i]);
    });

    breakdownEl.innerHTML = '';
    let total = 0;
    DIE_TYPES.forEach(type => {
      if(!grouped[type]) return;
      const values = grouped[type];
      total += values.reduce((a,b) => a+b, 0);
      const row = document.createElement('div');
      row.className = 'breakdown-row';
      row.innerHTML = `<span class="label">${values.length}d${type}</span>: ${values.join(', ')} &nbsp;(subtotal ${values.reduce((a,b)=>a+b,0)})`;
      breakdownEl.appendChild(row);
    });

    totalValueEl.textContent = total;
    resultsEl.style.display = 'block';
    announcer.textContent = 'Roll complete. Total is ' + total + '.';

    rollBtn.disabled = false;
    clearBtn.disabled = false;
  }

  rollBtn.addEventListener('click', () => {
    if(totalDiceCount() === 0) return;
    performRoll();
  });

  refreshPickers();
  refreshSummary();
</script>

</body>
</html>
